name: Research checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    name: Reproduce (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        python: ['3.11']
        include:
          - os: ubuntu-24.04
            python: '3.14'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.11.16'
          enable-cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.18.0'
      - name: Install locked checks and plotting tools
        run: uv sync --locked --extra figures --group checks --python ${{ matrix.python }}
      - name: Check public files, links and complete reachable history
        run: uv run --locked --extra figures --group checks python scripts/check_distribution.py --history --output results/distribution.json
      - name: Reproduce from an isolated wheel and source archive
        run: uv run --locked --extra figures --group checks python scripts/verify_reproduction.py --output results/reproduction
      - name: Retain research receipts and regenerated figures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: research-${{ matrix.os }}-python-${{ matrix.python }}
          retention-days: 14
          if-no-files-found: error
          path: |
            results/distribution.json
            results/reproduction/checks.json
            results/reproduction/chaksu/*
            results/reproduction/riga/*
            results/reproduction/figures/*

  secrets:
    name: Scan complete history
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan with default rules and redacted output
        shell: bash
        run: '"$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner --log-opts="--all --full-history" .'
